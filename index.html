<!DOCTYPE html>
<html>
  <head>
    <title>Enhanced Space Flight</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        position: relative;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #instructions {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-family: Arial, sans-serif;
        background: rgba(0, 0, 0, 0.5);
        padding: 15px;
        border-radius: 8px;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      #speedometer {
        position: absolute;
        bottom: 20px;
        right: 20px;
        color: #00ff00;
        font-family: "Courier New", monospace;
        background: rgba(0, 0, 0, 0.5);
        padding: 15px;
        border-radius: 8px;
        pointer-events: none;
      }
      .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: radial-gradient(
          circle,
          transparent 60%,
          rgba(0, 0, 0, 0.8) 100%
        );
        opacity: 0;
        transition: opacity 0.5s;
      }
      .mobile-controls {
        display: none;
      }

      @media (hover: none) and (pointer: coarse) {
        .desktop-controls {
          display: none;
        }
        .mobile-controls {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="instructions">
      <span class="desktop-controls">
        Move mouse to steer<br />
        Scroll to adjust speed<br />
        SPACE to toggle hyperdrive<br />
        M to toggle music
      </span>
      <span class="mobile-controls">
        Drag to steer<br />
        Pinch to adjust speed<br />
        Double tap for hyperdrive<br />
        Long press for music
      </span>
    </div>
    <div id="speedometer">Speed: 1.0x</div>
    <div class="vignette"></div>
    <audio id="backgroundMusic" loop>
      <source src="sad1.mp3" type="audio/mp3" />
    </audio>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const backgroundMusic = document.getElementById("backgroundMusic");
      let isMusicPlaying = false;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Star field parameters
      const starCount = 15000;
      const starPositions = new Float32Array(starCount * 3);
      const starSizes = new Float32Array(starCount);

      // Create random stars with varying sizes
      for (let i = 0; i < starCount * 3; i += 3) {
        starPositions[i] = THREE.Math.randFloatSpread(2000);
        starPositions[i + 1] = THREE.Math.randFloatSpread(2000);
        starPositions[i + 2] = THREE.Math.randFloatSpread(2000);
        starSizes[i / 3] = Math.random() * 0.2 + 0.1;
      }

      const starGeometry = new THREE.BufferGeometry();
      starGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(starPositions, 3)
      );
      starGeometry.setAttribute(
        "size",
        new THREE.BufferAttribute(starSizes, 1)
      );

      // Custom shader material for stars
      const starMaterial = new THREE.ShaderMaterial({
        uniforms: {
          color: { value: new THREE.Color(0xffffff) },
          hyperdriveEffect: { value: 0.0 },
        },
        vertexShader: `
          attribute float size;
          varying float vDistance;
          uniform float hyperdriveEffect;
          
          void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vDistance = -mvPosition.z;
            float hyperdriveStretch = 1.0 + hyperdriveEffect * (vDistance * 0.01);
            gl_PointSize = size * hyperdriveStretch * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying float vDistance;
          uniform vec3 color;
          uniform float hyperdriveEffect;
          
          void main() {
            float distanceFade = min(1.0, vDistance * 0.001);
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            float alpha = 1.0 - smoothstep(0.4, 0.5, dist);
            
            // Add color variation based on distance and hyperdrive
            vec3 finalColor = mix(color, vec3(0.5, 0.7, 1.0), hyperdriveEffect * distanceFade);
            
            gl_FragColor = vec4(finalColor, alpha * distanceFade);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const stars = new THREE.Points(starGeometry, starMaterial);
      scene.add(stars);

      // Enhanced nebulae
      const nebulaColors = [
        new THREE.Color(0xff6b6b),
        new THREE.Color(0x4ecdc4),
        new THREE.Color(0x45b7d1),
        new THREE.Color(0x96ceb4),
      ];
      const nebulae = [];

      for (let i = 0; i < 4; i++) {
        const nebulaParticleCount = 2000;
        const nebulaPositions = new Float32Array(nebulaParticleCount * 3);
        const nebulaSizes = new Float32Array(nebulaParticleCount);

        for (let j = 0; j < nebulaParticleCount * 3; j += 3) {
          nebulaPositions[j] = THREE.Math.randFloatSpread(400) + i * 200;
          nebulaPositions[j + 1] = THREE.Math.randFloatSpread(400);
          nebulaPositions[j + 2] = THREE.Math.randFloatSpread(400) - 500;
          nebulaSizes[j / 3] = Math.random() * 2 + 1;
        }

        const nebulaGeometry = new THREE.BufferGeometry();
        nebulaGeometry.setAttribute(
          "position",
          new THREE.BufferAttribute(nebulaPositions, 3)
        );
        nebulaGeometry.setAttribute(
          "size",
          new THREE.BufferAttribute(nebulaSizes, 1)
        );

        const nebulaMaterial = new THREE.ShaderMaterial({
          uniforms: {
            color: { value: nebulaColors[i] },
            time: { value: 0 },
            hyperdriveEffect: { value: 0.0 },
          },
          vertexShader: `
            attribute float size;
            varying float vDistance;
            uniform float time;
            uniform float hyperdriveEffect;
            
            void main() {
              vec3 pos = position;
              pos.x += sin(time * 0.001 + position.z * 0.01) * 10.0;
              pos.y += cos(time * 0.001 + position.x * 0.01) * 10.0;
              
              vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
              vDistance = -mvPosition.z;
              
              float hyperdriveStretch = 1.0 + hyperdriveEffect * (vDistance * 0.02);
              gl_PointSize = size * hyperdriveStretch * (300.0 / -mvPosition.z);
              gl_Position = projectionMatrix * mvPosition;
            }
          `,
          fragmentShader: `
            varying float vDistance;
            uniform vec3 color;
            uniform float hyperdriveEffect;
            
            void main() {
              float distanceFade = min(1.0, vDistance * 0.001);
              vec2 coord = gl_PointCoord - vec2(0.5);
              float dist = length(coord);
              float alpha = 1.0 - smoothstep(0.4, 0.5, dist);
              
              vec3 finalColor = mix(color, vec3(1.0), hyperdriveEffect * 0.5);
              gl_FragColor = vec4(finalColor, alpha * 0.6 * distanceFade);
            }
          `,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        const nebula = new THREE.Points(nebulaGeometry, nebulaMaterial);
        nebulae.push({
          points: nebula,
          positions: nebulaPositions,
          geometry: nebulaGeometry,
          material: nebulaMaterial,
        });
        scene.add(nebula);
      }

      camera.position.z = 5;

      // Flight control variables
      let speed = 1;
      let targetX = 0;
      let targetY = 0;
      let isHyperdrive = false;
      let hyperdriveEffect = 0;

      // Mouse movement handler
      document.addEventListener("mousemove", (event) => {
        targetX = (event.clientX - window.innerWidth / 2) * 0.001;
        targetY = (event.clientY - window.innerHeight / 2) * 0.001;
      });

      // Speed control with scroll
      document.addEventListener("wheel", (event) => {
        if (!isHyperdrive) {
          speed = Math.max(0.5, Math.min(3, speed + event.deltaY * 0.001));
          document.getElementById(
            "speedometer"
          ).textContent = `Speed: ${speed.toFixed(1)}x`;
        }
      });

      // Hyperdrive toggle
      document.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          isHyperdrive = !isHyperdrive;
          if (isHyperdrive) {
            document.querySelector(".vignette").style.opacity = "1";
            document.getElementById("speedometer").textContent =
              "HYPERDRIVE ENGAGED";
          } else {
            document.querySelector(".vignette").style.opacity = "0";
            document.getElementById(
              "speedometer"
            ).textContent = `Speed: ${speed.toFixed(1)}x`;
          }
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.code === "KeyM") {
          if (!isMusicPlaying) {
            backgroundMusic.play();
            isMusicPlaying = true;
          } else {
            backgroundMusic.pause();
            isMusicPlaying = false;
          }
        }
      });
      // Window resize handler
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Mobile touch controls
      let touchStartX = 0;
      let touchStartY = 0;
      let isTouching = false;

      document.addEventListener("touchstart", (event) => {
        touchStartX = event.touches[0].clientX;
        touchStartY = event.touches[0].clientY;
        isTouching = true;
      });

      document.addEventListener(
        "touchmove",
        (event) => {
          if (isTouching) {
            event.preventDefault();
            const touchX = event.touches[0].clientX;
            const touchY = event.touches[0].clientY;

            targetX = (touchX - window.innerWidth / 2) * 0.001;
            targetY = (touchY - window.innerHeight / 2) * 0.001;
          }
        },
        { passive: false }
      );

      document.addEventListener("touchend", () => {
        isTouching = false;
      });

      // Add double tap for hyperdrive
      let lastTap = 0;
      document.addEventListener("touchend", (event) => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 500 && tapLength > 0) {
          isHyperdrive = !isHyperdrive;
          if (isHyperdrive) {
            document.querySelector(".vignette").style.opacity = "1";
            document.getElementById("speedometer").textContent =
              "HYPERDRIVE ENGAGED";
          } else {
            document.querySelector(".vignette").style.opacity = "0";
            document.getElementById(
              "speedometer"
            ).textContent = `Speed: ${speed.toFixed(1)}x`;
          }
        }
        lastTap = currentTime;
      });

      // Add two-finger pinch for speed control
      let initialPinchDistance = 0;

      document.addEventListener("touchstart", (event) => {
        if (event.touches.length === 2) {
          initialPinchDistance = Math.hypot(
            event.touches[0].clientX - event.touches[1].clientX,
            event.touches[0].clientY - event.touches[1].clientY
          );
        }
      });

      document.addEventListener("touchmove", (event) => {
        if (event.touches.length === 2 && !isHyperdrive) {
          const currentDistance = Math.hypot(
            event.touches[0].clientX - event.touches[1].clientX,
            event.touches[0].clientY - event.touches[1].clientY
          );

          const pinchDelta = (currentDistance - initialPinchDistance) * 0.01;
          speed = Math.max(0.5, Math.min(3, speed + pinchDelta));
          document.getElementById(
            "speedometer"
          ).textContent = `Speed: ${speed.toFixed(1)}x`;

          initialPinchDistance = currentDistance;
        }
      });

      let longPressTimer;

      document.addEventListener("touchstart", () => {
        longPressTimer = setTimeout(() => {
          if (!isMusicPlaying) {
            backgroundMusic.play();
            isMusicPlaying = true;
          } else {
            backgroundMusic.pause();
            isMusicPlaying = false;
          }
        }, 800);
      });

      document.addEventListener("touchend", () => {
        clearTimeout(longPressTimer);
      });

      const clock = new THREE.Clock();

      // Animation loop
      function animate() {
        requestAnimationFrame(animate);
        const deltaTime = clock.getDelta();

        // Smooth camera movement
        camera.rotation.x += (targetY - camera.rotation.x) * 0.05;
        camera.rotation.y += (targetX - camera.rotation.y) * 0.05;

        // Update hyperdrive effect
        const hyperdriveTarget = isHyperdrive ? 1.0 : 0.0;
        hyperdriveEffect += (hyperdriveTarget - hyperdriveEffect) * 0.1;

        // Update star shader
        stars.material.uniforms.hyperdriveEffect.value = hyperdriveEffect;

        // Move stars
        stars.rotation.z += 0.0003;
        const positions = starGeometry.attributes.position.array;
        const currentSpeed = isHyperdrive ? 15 : speed;

        for (let i = 0; i < positions.length; i += 3) {
          positions[i + 2] += currentSpeed;
          if (positions[i + 2] > 1000) positions[i + 2] -= 2000;
        }
        starGeometry.attributes.position.needsUpdate = true;

        // Animate nebulae
        nebulae.forEach((nebula, index) => {
          nebula.points.rotation.z += 0.0001 * (index + 1);
          nebula.material.uniforms.time.value += deltaTime * 1000;
          nebula.material.uniforms.hyperdriveEffect.value = hyperdriveEffect;

          const positions = nebula.positions;
          for (let i = 0; i < positions.length; i += 3) {
            positions[i + 2] += currentSpeed * 0.5;
            if (positions[i + 2] > 1000) positions[i + 2] -= 1500;
          }
          nebula.geometry.attributes.position.needsUpdate = true;
        });

        renderer.render(scene, camera);
      }

      animate();

      // Hide instructions after 5 seconds
      setTimeout(() => {
        document.getElementById("instructions").style.opacity = "0";
      }, 5000);
    </script>
  </body>
</html>
